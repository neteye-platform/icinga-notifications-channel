[package]
name = "icinga-notifications-channel-macros"
version = "0.1.0"
edition = "2024"
license.workspace = true
repository.workspace = true
description = "Derive macros for icinga-notifications-channel"

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "=1.0.103"
quote = "=1.0.41"
syn = { version = "=2.0.108", features = ["full", "extra-traits"] }
toml = { version = "=1.1.8+spec-1.1.0", default-features = false, features = ["parse", "serde", "std"] }
