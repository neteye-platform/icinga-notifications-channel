[package]
name = "icinga-notifications-channel-macros"
version = "0.1.0"
edition = "2024"
description = "Derive macros for icinga-notifications-channel"

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "3", features = ["full", "extra-traits"] }
toml = { version = "1.0", default-features = false, features = ["parse", "serde", "std"] }
