[package]
name = "jsonrpc-rs"
version = "0.2.0"
edition = "2024"

[dependencies]
erased-serde = "0.4.8"
futures-util = { version = "0.3.31", features = ["sink"]}
monostate = "1.0.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.145", features = ["raw_value"] }
async-lock = {version = "3.4.1", default-features = false}
tracing = "0.1.40"

jsonrpc_rs-macros = { path = "../jsonrpc-macros", optional = true, version = "0.2.0" }

tokio-util = { version = "0.7.16", features = ["codec"], optional = true }
tokio = { version = "1.48.0", optional = true, default-features = false}

[dev-dependencies]
tokio = { version = "1.48.0", features = ["macros", "rt", "io-std", "time"]}
tokio-util = { version = "0.7.16", features = ["codec"] }


[features]
default = ["tokio_util", "macros"]
tokio_util = ["dep:tokio-util", "futures-util/io", "dep:tokio"]
macros = ["dep:jsonrpc_rs-macros"]
# Send responses in request order instead of completion order.
ordered = []

[[example]]
name = "nl_jsonrpc"
